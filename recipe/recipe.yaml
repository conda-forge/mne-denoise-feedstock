context:
  name: mne-denoise
  version: "0.0.2"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/mne_denoise-${{ version }}.tar.gz
  sha256: cdfbfcbd67f2637c914d5fd9316b843d17fe0e4ace0686c286ea8878484e9ba1

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatch-vcs
    - hatchling >=1.27
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.26,<3
    - scipy >=1.13
    - scikit-learn >=1.5
    - joblib >=1.4

  run_constraints:
    # Optional upstream integrations: constrain compatible versions without
    # making them mandatory dependencies of the base conda package.
    - mne-base >=1.13.0
    - matplotlib-base >=3.8
    - seaborn >=0.13
    - tqdm >=4.66

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - mne_denoise
      pip_check: true

about:
  homepage: https://mne.tools/mne-denoise/
  summary: Artifact removal and signal denoising for EEG and MEG.
  description: |
    mne-denoise provides artifact-suppression and signal-denoising methods
    for EEG and MEG, with NumPy and MNE-Python integration.
  license: BSD-3-Clause
  license_file: LICENSE
  documentation: https://mne.tools/mne-denoise/
  repository: https://github.com/mne-tools/mne-denoise

extra:
  recipe-maintainers:
    - BabaSanfour
    - larsoner
